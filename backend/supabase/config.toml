[functions.crm-billing]
# The handler verifies Supabase users, Razorpay signatures, or the private Cron token.
verify_jwt = false

[functions.account-security]
# Public password login; all other actions verify the user and native session.
verify_jwt = false

[functions.proposal-email]
# Clients open proposals without signing in, so the handler checks the link
# itself; sending and withdrawing verify the member and their session.
verify_jwt = false

[functions.align-notifications]
# Called only by the scheduler; the handler checks the private credential
# stored in Vault instead of a user sign-in.
verify_jwt = false
