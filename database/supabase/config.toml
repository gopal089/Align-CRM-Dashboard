# Database-only Supabase workspace.
# Run database CLI commands from the repository root with:
# npx supabase --workdir database <command>

# Optional direct password-login limits (hosted Teams/Enterprise only).
# Disabled locally to match the current staging profile. Hosted Auth must also leave it disabled.
[auth.hook.password_verification_attempt]
enabled = false
uri = "pg-functions://postgres/private/security_password_attempt"
